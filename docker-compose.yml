
services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-chatbot

    ports:
      - "8501:8501"

    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore

    env_file:
      - .env

    environment:
      - PYTHONPATH=/app/src

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3